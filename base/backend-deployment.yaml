apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend-image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/orangydb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongo:27017/orangy_media"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_JPA_SHOW_SQL
              value: "true"
            # These were committed here in plaintext, in a public repo. They now
            # come from the `orangy-secrets` Secret, which is created per
            # namespace and never committed — see overlays/prod/SECRETS.md.
            # NOTE: the previously committed values must be treated as leaked
            # and rotated, even though they were test credentials.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orangy-secrets
                  key: jwt-secret
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: orangy-secrets
                  key: razorpay-key-id
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: orangy-secrets
                  key: razorpay-key-secret
            # OTP login goes out over SMTP, so these are load-bearing for
            # sign-in. Previously they came from a Gmail app password hardcoded
            # in application.yml — in a public repo. Required, so a
            # misconfiguration fails the rollout instead of silently breaking
            # every login.
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orangy-secrets
                  key: mail-username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orangy-secrets
                  key: mail-password
            # Optional: absent means DataSeeder creates no admin at all, which
            # is the safe outcome. Only needed on a fresh database.
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: orangy-secrets
                  key: admin-email
                  optional: true
            - name: ADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orangy-secrets
                  key: admin-password
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # A TCP check on 8080 passed as soon as Tomcat bound the port, even
          # if Postgres, Mongo or Redis were unreachable — so a backend that
          # could not serve a single request still counted as Ready. These
          # check the actual dependency health via Actuator.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          # Gives a slow JVM boot up to 3 minutes before liveness starts
          # counting, without making liveness itself sluggish.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 18
