apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

namespace: orangy-prod

# Image tag to be replaced by Jenkins CI
images:
  - name: backend-image
    newName: ghcr.io/vedantkhursange/orangy-backend
    newTag: prod-latest
  - name: frontend-image
    newName: ghcr.io/vedantkhursange/orangy-frontend
    newTag: prod-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        replicas: 2
  # Dev's Services claim NodePorts 30080/30300 cluster-wide (NodePorts are
  # cluster-scoped, not per-namespace) — prod needs distinct ports so both
  # environments can coexist on the same cluster.
  - target:
      kind: Service
      name: backend
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30301
